# CI: every push builds the engine and runs every test. Jobs mirror the CMake presets, so each one can be
# reproduced locally with `cmake --preset <name>` / `cmake --build --preset <name>` / `ctest --preset <name>`.
# The repo is private (Actions minutes are billed, Windows at 2x), so Windows Release runs only on main and
# on manual runs; the other jobs run on every branch. GPU tests (golden images, label "gpu") run on Linux only:
# Windows runners have no OpenGL 3.3; Linux draws them with Mesa llvmpipe (software) under xvfb.
name: CI

on:
  push:
    paths-ignore: ["**.md"]  # docs only: nothing to build
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg keeps the packages it built (glfw, glm) here; actions/cache saves the folder between runs.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  windows:
    name: Windows MSVC ${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        # Release only on main and manual runs (a job-level if can't see the matrix, so the list itself changes)
        config: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["debug","release"]' || '["debug"]') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1  # cl.exe + Ninja on PATH for the Ninja generator
      - name: Make the vcpkg cache folder
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_COMMIT=$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-windows-
      - name: Configure
        run: cmake --preset windows-${{ matrix.config }}
      - name: Build
        run: cmake --build --preset windows-${{ matrix.config }}
      - name: Test
        run: ctest --preset windows-${{ matrix.config }} -j4 -LE gpu
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows-${{ matrix.config }}
          path: build/windows-${{ matrix.config }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux-asan:
    name: Linux clang ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install packages
        # GLFW's X11/Wayland headers (vcpkg builds glfw from source), Ninja, ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libgl-dev \
            xvfb xauth libgl1-mesa-dri
      - name: Make the vcpkg cache folder
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_COMMIT=$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-linux-
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-asan
      - name: Configure
        run: cmake --preset linux-asan -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset linux-asan
      - name: Test
        run: ctest --preset linux-asan -j4 -LE gpu
      - name: GPU tests (golden images on llvmpipe)
        if: '!cancelled()'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # Mesa and X11 keep allocations until exit that LeakSanitizer would report; leaks are checked above.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: xvfb-run -a -s "-screen 0 1024x768x24" ctest --preset linux-asan -j4 -L gpu
      - name: Upload the golden-image output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-output
          path: build/linux-asan/tests/gpu/gpu_output
          if-no-files-found: ignore
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-linux-asan
          path: build/linux-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  android:
    name: Android arm64 (engine + Snake)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 30.0.16248370  # the version the games pin in Gradle (ndkVersion)
    steps:
      - uses: actions/checkout@v4  # no submodules: Android doesn't use vcpkg (glm comes from FetchContent)
      - name: Install the NDK and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
      - name: Configure
        run: cmake --preset android-arm64 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset android-arm64
